# Example Tasks.
#
# hello-world: smoke test the provider (Q1). Create AFTER the Provider reports
# Ready, or the first reconcile races and Fails; just re-apply if so.
#
# capz-analyze: a real CAPZ failure investigation using both tool tiers, the
# filesystem tools (30-tools.yaml) and the k8s discovery tools (35-k8s-tools.yaml).
# For a full project-prompt run, set ai.systemPrompt to the consumer's
# prompts/system.md content (see README).
apiVersion: core.orka.ai/v1alpha1
kind: Task
metadata:
  name: hello-world
  namespace: orka-system
spec:
  type: ai
  ai:
    providerRef:
      name: gh-models
    prompt: "Reply with exactly: ORKA_SPIKE_OK"
---
apiVersion: core.orka.ai/v1alpha1
kind: Task
metadata:
  name: capz-analyze
  namespace: orka-system
spec:
  type: ai
  timeout: 5m
  ai:
    providerRef:
      name: gh-models
    model: openai/gpt-4o
    tools:
    - list-artifacts
    - find-artifacts
    - grep-artifact
    - read-artifact
    - tail-artifact
    - discover-clusters
    - find-my-cluster
    - list-cluster-machines
    - list-machine-logs
    - discover-controllers
    - resolve-controller-log
    systemPrompt: |
      You are a CI failure analyst for the Cluster API Provider Azure (CAPZ) project.
      You have read-only tools over one Prow build's GCS artifact tree. All paths are
      relative to the build root. A build runs many specs, each with its own workload
      cluster under artifacts/clusters/. To attribute a failure correctly: call
      find-my-cluster (or discover-clusters and reason about the flavor) BEFORE reading
      per-cluster logs, so you inspect the right cluster's
      artifacts/clusters/<cluster>/azure-activity-logs/<cluster>.log. Investigate before
      concluding. Base every claim on artifact content you actually read; do not guess.
    prompt: |
      This CAPZ e2e build FAILED. Identify the single most likely root cause.
      Steps: (1) find the JUnit XML and identify a failed test name; (2) resolve which
      cluster that test ran against; (3) grep build-log.txt and the right cluster's
      logs for the failure's error lines; (4) give a 3-sentence root-cause summary
      citing the specific artifact paths and error text you used.
