{{- include "prow-ai-dashboard.validateSourceInvestigation" . -}}
{{- if .Values.server.chat.sourceInvestigation.enabled }}
{{- $cfg := .Values.server.chat.sourceInvestigation.admission -}}
{{- $sa := include "prow-ai-dashboard.orkaSourceServiceAccountName" . -}}
{{- $requester := printf "system:serviceaccount:%s:%s" .Release.Namespace $sa -}}
{{- $repo := printf "https://github.com/%s/%s.git" $cfg.repository.owner $cfg.repository.name -}}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "prow-ai-dashboard.orkaSourceAdmissionName" . }}
  labels:
    {{- include "prow-ai-dashboard.labels" . | nindent 4 }}
    app.kubernetes.io/component: orka-source-investigation
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["core.orka.ai"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["tasks"]
        scope: Namespaced
  matchConditions:
    - name: source-requester
      expression: {{ printf "request.operation == 'CREATE' ? request.userInfo.username == %s : (request.userInfo.username == %s || (has(oldObject.metadata.labels) && 'app.kubernetes.io/managed-by' in oldObject.metadata.labels && oldObject.metadata.labels['app.kubernetes.io/managed-by'] == 'orka-source-investigator'))" (toJson $requester) (toJson $requester) | quote }}
    - name: source-namespace
      expression: {{ printf "object.metadata.namespace == %s" (toJson .Values.orka.namespace) | quote }}
  validations:
    - expression: "request.operation != 'UPDATE' || (object.spec == oldObject.spec && object.metadata.labels == oldObject.metadata.labels && object.metadata.annotations == oldObject.metadata.annotations)"
      message: "source investigation Task contracts are immutable"
    - expression: "object.spec.type == 'agent' && (!has(object.spec.image) || object.spec.image == '') && (!has(object.spec.command) || size(object.spec.command) == 0) && (!has(object.spec.args) || size(object.spec.args) == 0) && (!has(object.spec.env) || size(object.spec.env) == 0) && !has(object.spec.secretRef)"
      message: "source investigation Tasks must use only the approved Agent runtime"
    - expression: {{ printf "has(object.spec.agentRef) && object.spec.agentRef.name == %s && object.spec.agentRef.namespace == %s" (toJson $cfg.agentRef) (toJson .Values.orka.namespace) | quote }}
      message: "source investigation Tasks must use the approved Agent"
    - expression: {{ printf "object.spec.agentRuntime.workspace.gitRepo == %s && object.spec.agentRuntime.workspace.ref.matches('^[0-9a-f]{40}$') && object.spec.agentRuntime.workspace.gitSecretRef.name == %s" (toJson $repo) (toJson $cfg.gitSecret) | quote }}
      message: "source investigation Tasks must use the approved repository, commit, and read-only Git Secret"
    - expression: {{ printf "object.spec.agentRuntime.maxTurns == %v && object.spec.agentRuntime.allowBash == false && object.spec.agentRuntime.allowedTools == ['Read', 'Glob', 'Grep'] && object.spec.agentRuntime.disallowedTools == ['Bash', 'Write', 'Edit', 'MultiEdit', 'NotebookEdit', 'WebFetch', 'WebSearch', 'Task', 'TodoWrite', 'Question']" $cfg.maxTurns | quote }}
      message: "source investigation Tasks must use the bounded read-only tool policy"
    - expression: {{ printf "duration(object.spec.timeout) == duration(%s) && object.spec.retryPolicy.maxRetries == %v && object.spec.priority == 500" (toJson (printf "%v" $cfg.timeout)) $cfg.retries | quote }}
      message: "source investigation Tasks must use the configured execution bounds"
    - expression: "!has(object.spec.webhookURL) && !has(object.spec.sessionRef) && !has(object.spec.priorTaskRef) && !has(object.spec.schedule) && !has(object.spec.timeZone) && !has(object.spec.ai) && !has(object.spec.workspace) && !has(object.spec.execution) && (!has(object.spec.resources) || size(object.spec.resources.requests) == 0 && size(object.spec.resources.limits) == 0)"
      message: "source investigation Tasks must not add alternate execution or scheduling fields"
    - expression: "size(object.metadata.labels) == 1 && object.metadata.labels['app.kubernetes.io/managed-by'] == 'orka-source-investigator' && size(object.metadata.annotations) == 3 && object.metadata.annotations['orka.ai/workspace-init-container'] == 'true' && object.metadata.annotations['orka.ai/agent-read-only'] == 'true' && object.metadata.annotations['orka.ai/disable-coordination-tool-injection'] == 'true'"
      message: "source investigation Tasks must carry the exact read-only identity metadata"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ include "prow-ai-dashboard.orkaSourceAdmissionName" . }}
spec:
  policyName: {{ include "prow-ai-dashboard.orkaSourceAdmissionName" . }}
  validationActions: [Deny]
{{- end }}
