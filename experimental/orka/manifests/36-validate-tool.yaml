# Deterministically verifies cited paths and consumer skill evidence. The
# producer compiles consumer recipes into this Tool's scoped headers.
apiVersion: core.orka.ai/v1alpha1
kind: Tool
metadata:
  name: validate-analysis
  namespace: orka-system
spec:
  description: "Verify every cited artifact path exists and that the draft analysis includes the evidence groups required by matching consumer recipes. Pass all cited paths plus the draft summary, root cause, and fix. Reject the draft if the tool reports missing paths or evidence."
  http:
    url: http://artifact-tool.orka-system.svc:8080/tool/validate_analysis
    method: POST
  parameters:
    type: object
    properties:
      paths:
        type: array
        items:
          type: string
        description: "Every artifact path cited or relied on by the draft analysis."
      analysis:
        type: string
        description: "The draft summary, root cause, and suggested fix used to match consumer recipe triggers."
    required: [paths, analysis]
