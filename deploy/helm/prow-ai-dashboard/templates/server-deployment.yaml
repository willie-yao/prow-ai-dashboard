{{- $actions := gt (len .Values.server.actions.admins) 0 -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "prow-ai-dashboard.fullname" . }}-server
  labels:
    {{- include "prow-ai-dashboard.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  replicas: {{ .Values.server.replicaCount }}
  selector:
    matchLabels:
      {{- include "prow-ai-dashboard.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        {{- include "prow-ai-dashboard.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: server
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: server
          image: {{ include "prow-ai-dashboard.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /usr/local/bin/server
            - -addr=:{{ .Values.server.port }}
            - -data-dir={{ .Values.persistence.mountPath }}
            - -static-dir={{ .Values.server.staticDir }}
            {{- if $actions }}
            - -project-dir={{ .Values.project.mountPath }}
            {{- end }}
          {{- if $actions }}
          env:
            - name: ADMIN_LOGINS
              value: {{ join "," .Values.server.actions.admins | quote }}
            {{- if .Values.ai.enabled }}
            - name: AI_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "prow-ai-dashboard.aiSecret" . }}
                  key: {{ .Values.ai.tokenSecretKey }}
            {{- if .Values.ai.endpoint }}
            - name: AI_ENDPOINT
              value: {{ .Values.ai.endpoint | quote }}
            {{- end }}
            {{- if .Values.ai.model }}
            - name: AI_MODEL
              value: {{ .Values.ai.model | quote }}
            {{- end }}
            {{- end }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.server.port }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
              # Read-write when actions are enabled: the server persists issue
              # and fix-PR dedup state next to the data it serves.
              readOnly: {{ not $actions }}
            {{- if $actions }}
            - name: project
              mountPath: {{ .Values.project.mountPath }}
              readOnly: true
            - name: tmp
              mountPath: /tmp
            {{- end }}
          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}
      {{- with .Values.server.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.server.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.server.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "prow-ai-dashboard.pvcName" . }}
        {{- if $actions }}
        - name: project
          configMap:
            name: {{ include "prow-ai-dashboard.projectConfigMap" . }}
            items:
              - key: project.yaml
                path: project.yaml
              - key: system.md
                path: prompts/system.md
        - name: tmp
          emptyDir: {}
        {{- end }}
